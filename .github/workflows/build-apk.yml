# .github/workflows/build-apk.yml
# ساخت APK اندروید (debug) از پروژه‌ی BrainChart
# پروژه باید به یکی از این دو شکل در ریپو باشد:
#   1) پوشه‌ی BrainChart/ (با settings.gradle.kts داخلش)
#   2) فایل BrainChart-android-source.zip در ریشه‌ی ریپو (خودکار باز می‌شود)

name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project if zip is present
        run: |
          if [ ! -f BrainChart/settings.gradle.kts ]; then
            if [ -f BrainChart-android-source.zip ]; then
              mkdir -p BrainChart
              unzip -o -q BrainChart-android-source.zip -d BrainChart
            else
              echo "❌ پروژه پیدا نشد: پوشه BrainChart/ یا فایل BrainChart-android-source.zip باید در ریشه‌ی ریپو باشد"
              exit 1
            fi
          fi
          echo "✅ پروژه آماده است:"; ls -la BrainChart

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKM" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: BrainChart
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Show build errors in Summary (on failure)
        if: failure()
        run: |
          {
            echo "## ❌ خطای بیلد"
            echo '```'
            grep -A 25 "What went wrong" build.log || true
            echo "--- خطاهای pip / پکیج‌ها ---"
            grep -iE "pip|ERROR|No matching|Could not|not found|requirement" build.log | tail -n 60 || true
            echo "--- آخرین خطوط لاگ ---"
            tail -n 40 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrainChart-debug-apk
          path: BrainChart/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
